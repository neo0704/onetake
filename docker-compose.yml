version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: onetake_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: onetake

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onetake_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/onetake
      - JWT_SECRET=change_this_in_production_super_secret_key
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onetake_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
